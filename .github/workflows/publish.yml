name: Publish today's post

on:
  schedule:
    - cron: "30 4-6,10-15 * * *"  # backup: hourly 12:30–14:30 and 18:30–23:30 SGT; --window posts only items due in the last 3 h
  workflow_dispatch:          # cron-job.org calls this at 12:30, 18:30, 20:30 and 21:30 SGT every day
    inputs:
      catch_up:
        description: "Also post approved items from earlier days that were missed"
        type: boolean
        default: false

permissions:
  contents: write          # lets the job push post.json back

concurrency: publish       # runs queue up, never post side by side

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 publish.py next ${{ github.event_name == 'schedule' && '--window' || (inputs.catch_up && '--catch-up' || '') }}
      - name: Record posted items
        if: always()           # record what went out even if a later item or the missed-check failed
        run: |
          git config user.name "Mug Smarter publisher"
          git config user.email "actions@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || { git commit -m "Posted $(date -u +%F)"; git push; }
