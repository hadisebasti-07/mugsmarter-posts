name: Verify token (never posts)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which Instagram account is the token for
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          u = "https://graph.instagram.com/v21.0/me?fields=username,account_type&access_token=" + os.environ["IG_ACCESS_TOKEN"]
          print(json.load(urllib.request.urlopen(u)))
          PY
      - name: Test-upload today's items (creates containers, publishes nothing)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          for d in queue/$(TZ=Asia/Singapore date +%F)-*/; do python3 publish.py check "$(basename "$d")"; done
